---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ### Comprehensive Test Suite (All Fixtures) ###
  test-comprehensive:
    name: 'Comprehensive Test Suite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run comprehensive test suite'
        run: |
          echo "🧪 Running comprehensive test suite..."
          ./tests/scripts/test_all.sh

  ### Test External Repository ###
  test-external-repo:
    name: 'Test External Repository'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'
          persist-credentials: false

      # yamllint disable rule:line-length

      - name: 'Test External Project'
        id: test-external
        uses: $/
        with:
          path_prefix: 'test-python-project/'

      - name: 'Validate External Project Output'
        run: |
          echo "Build Python: '${STEPS_TEST_EXTERNAL_OUTPUTS_BUILD_PYTHON}'"

          # Use the raw matrix_json output and compact it with jq for consistent comparison
          actual_json=$(echo "${STEPS_TEST_EXTERNAL_OUTPUTS_MATRIX_JSON}" | jq -c .)
          echo "Matrix JSON: '$actual_json'"

          # Validate that outputs are not empty
          if [ -z "${STEPS_TEST_EXTERNAL_OUTPUTS_BUILD_PYTHON}" ]; then
            echo "Error: build_python output is empty"
            exit 1
          fi
          if [ -z "${STEPS_TEST_EXTERNAL_OUTPUTS_MATRIX_JSON}" ]; then
            echo "Error: matrix_json output is empty"
            exit 1
          fi

          # Validate matrix_json contains only valid Python versions (no text values)
          # Extract the python-version array and check each element is a valid version number
          if ! echo "$actual_json" | jq -e '.["python-version"] | type == "array"' >/dev/null; then
            echo "Error: matrix_json does not contain a python-version array"
            exit 1
          fi

          # Check that all array elements are valid version strings (X.Y format)
          invalid_versions=$(echo "$actual_json" | jq -r '.["python-version"][] | select(test("^[0-9]+\\.[0-9]+$") | not)')
          if [ -n "$invalid_versions" ]; then
            echo "Error: matrix_json contains invalid version entries:"
            echo "$invalid_versions"
            echo "Expected format: only numeric versions like '3.11', '3.12'"
            exit 1
          fi

          # For test-python-project, derive the expected Python versions
          # from the classifiers in the checked-out pyproject.toml. This avoids
          # reliance on the repository-level EXPECTED_VERSION_JSON variable,
          # which is not reliably populated for pull_request events from forks
          # and also requires manual updates whenever the upstream project's
          # classifiers change. Parsing the source of truth keeps the test
          # self-contained.
          #
          # The project also declares an open-ended requires-python (e.g.
          # ">=3.11"), which the action rightly prefers over classifiers. When
          # a new CPython minor ships, the live API offers it before the
          # project adds a matching classifier, so the matrix legitimately
          # grows past the newest classifier. An exact match would then fail
          # on every CPython release, so instead assert that:
          #   * every classifier version appears in the matrix, and
          #   * any extra version is newer than the newest classifier.
          # Extra versions inside the declared range still fail the test.
          pyproject='test-python-project/pyproject.toml'
          if [ ! -f "$pyproject" ]; then
            echo "Error: expected file not found: $pyproject"
            exit 1
          fi

          # Mirror the action's own parsing behaviour so this test
          # tracks the action's *final* sorted output:
          #   * Strip commented lines before matching classifiers, as
          #     the action does in its classifier fallback path (see
          #     'extract_classifiers_fallback' in both action.yaml and
          #     lib/constraint_utils.sh). Without this, a commented-out
          #     classifier line in pyproject.toml would produce a false
          #     mismatch.
          #   * Use the same portable numeric sort the action applies
          #     via its 'sort_versions' helper (also in action.yaml and
          #     lib/constraint_utils.sh): 'sort -t. -k1,1n -k2,2n'. This
          #     avoids relying on GNU-specific 'sort -V' and keeps the
          #     ordering identical to what the action emits in
          #     matrix_json.
          #   * Deduplicate with awk (first-seen wins) instead of
          #     'sort -u' so the numeric sort order is preserved.
          #
          # GitHub Actions runs bash with 'set -eo pipefail' by default,
          # which would make the assignment below abort the step if
          # 'grep' finds no matches (exit 1) before our explicit
          # empty-check can print a user-friendly error. Append
          # '|| true' to tolerate a no-match exit, then rely on the
          # explicit '[ -z ... ]' check to diagnose extraction failures
          # distinctly from genuine action/output disagreements.
          classifier_versions=$(grep -v '^[[:space:]]*#' "$pyproject" | grep -oE 'Programming Language :: Python :: [0-9]+\.[0-9]+' | awk -F':: ' '{print $NF}' | sort -t. -k1,1n -k2,2n | awk '!seen[$0]++' || true)
          if [ -z "$classifier_versions" ]; then
            echo "Error: no 'Programming Language :: Python :: X.Y' classifiers found in $pyproject"
            echo "Cannot derive expected python-version list; check the upstream project or the extraction regex."
            exit 1
          fi

          expected_json=$(printf '%s\n' "$classifier_versions" | jq -R . | jq -s -c '{"python-version": .}')
          echo "Expected (derived from classifiers): '$expected_json'"

          # Compare numerically ("3.10" > "3.9") by splitting X.Y into [X, Y]
          comparison=$(jq -n -c --argjson e "$expected_json" --argjson a "$actual_json" '
            def key: split(".") | map(tonumber);
            $e["python-version"] as $want
            | $a["python-version"] as $got
            | ($want | max_by(key) | key) as $top
            | {
                missing: ($want - $got),
                newer: [($got - $want)[] | select(key > $top)],
                unexpected: [($got - $want)[] | select(key <= $top)]
              }')

          missing=$(echo "$comparison" | jq -r '.missing | join(" ")')
          unexpected=$(echo "$comparison" | jq -r '.unexpected | join(" ")')
          newer=$(echo "$comparison" | jq -r '.newer | join(" ")')

          if [ -n "$missing" ] || [ -n "$unexpected" ]; then
            echo "Error: matrix_json mismatch for test-python-project"
            echo "Expected: $expected_json"
            echo "Actual:   $actual_json"
            [ -n "$missing" ] && echo "Missing classifier versions: $missing"
            [ -n "$unexpected" ] && echo "Unexpected versions within the classifier range: $unexpected"
            exit 1
          fi

          if [ -n "$newer" ]; then
            echo "::notice::Matrix includes CPython releases newer than test-python-project's classifiers: $newer"
          fi

          echo "External repository test passed ✅"
        env:
          STEPS_TEST_EXTERNAL_OUTPUTS_BUILD_PYTHON: ${{ steps.test-external.outputs.build_python }}
          STEPS_TEST_EXTERNAL_OUTPUTS_MATRIX_JSON: ${{ steps.test-external.outputs.matrix_json }}

  ### Test empty path_prefix (falls back to the workspace root) ###
  test-empty-path-prefix:
    name: 'Test Empty path_prefix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      # Check out the sample project at the workspace root, so an omitted
      # and an empty path_prefix must both resolve to it
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-python-project'
          persist-credentials: false

      # Offline mode keeps both runs on the same internal version list, so
      # their outputs cannot diverge through a flaky EOL API lookup
      - name: 'Run action with path_prefix omitted (input default)'
        id: test-default
        uses: $/
        with:
          offline_mode: 'true'

      # The input default applies only when the key is absent; an explicit
      # empty value reaches the script as an empty string
      - name: 'Run action with empty path_prefix'
        id: test-empty
        uses: $/
        with:
          path_prefix: ''
          offline_mode: 'true'

      - name: 'Validate empty path_prefix matches the default'
        env:
          DEFAULT_OUTCOME: ${{ steps.test-default.outcome }}
          EMPTY_OUTCOME: ${{ steps.test-empty.outcome }}
          DEFAULT_BUILD_PYTHON: ${{ steps.test-default.outputs.build_python }}
          EMPTY_BUILD_PYTHON: ${{ steps.test-empty.outputs.build_python }}
          DEFAULT_MATRIX_JSON: ${{ steps.test-default.outputs.matrix_json }}
          EMPTY_MATRIX_JSON: ${{ steps.test-empty.outputs.matrix_json }}
          DEFAULT_SUPPORTED_VERSIONS: ${{ steps.test-default.outputs.supported_versions }}
          EMPTY_SUPPORTED_VERSIONS: ${{ steps.test-empty.outputs.supported_versions }}
          DEFAULT_VERSIONS_SOURCE: ${{ steps.test-default.outputs.versions_source }}
          EMPTY_VERSIONS_SOURCE: ${{ steps.test-empty.outputs.versions_source }}
        run: |
          set -euo pipefail
          if [ "$DEFAULT_OUTCOME" != "success" ] || [ "$EMPTY_OUTCOME" != "success" ]; then
            echo "::error::Action did not succeed (default=$DEFAULT_OUTCOME empty=$EMPTY_OUTCOME)"
            exit 1
          fi

          # A fallback source would mean the project metadata at the
          # workspace root was never read
          case "$EMPTY_VERSIONS_SOURCE" in
            ''|eol-fallback|static-fallback)
              echo "::error::Workspace root metadata not used (versions_source='$EMPTY_VERSIONS_SOURCE')"
              exit 1
              ;;
          esac
          if [ -z "$EMPTY_SUPPORTED_VERSIONS" ]; then
            echo "::error::supported_versions is empty"
            exit 1
          fi
          if ! printf '%s' "$EMPTY_BUILD_PYTHON" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::build_python is empty or malformed: '$EMPTY_BUILD_PYTHON'"
            exit 1
          fi
          versions_count=$(printf '%s' "$EMPTY_MATRIX_JSON" | jq -r '."python-version" | length')
          if [ -z "$versions_count" ] || [ "$versions_count" -lt 1 ]; then
            echo "::error::matrix_json has empty or missing python-version array: '$EMPTY_MATRIX_JSON'"
            exit 1
          fi

          status=0
          assert_same() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 differs: default='$2' empty='$3'"
              status=1
            fi
          }
          assert_same build_python "$DEFAULT_BUILD_PYTHON" "$EMPTY_BUILD_PYTHON"
          assert_same matrix_json "$DEFAULT_MATRIX_JSON" "$EMPTY_MATRIX_JSON"
          assert_same supported_versions "$DEFAULT_SUPPORTED_VERSIONS" "$EMPTY_SUPPORTED_VERSIONS"
          assert_same versions_source "$DEFAULT_VERSIONS_SOURCE" "$EMPTY_VERSIONS_SOURCE"
          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "Empty path_prefix resolved to the workspace root ✅"
          echo "  versions_source=$EMPTY_VERSIONS_SOURCE"
          echo "  supported_versions=$EMPTY_SUPPORTED_VERSIONS"
          echo "  build_python=$EMPTY_BUILD_PYTHON"
          echo "  matrix_json=$EMPTY_MATRIX_JSON"

  ### Test Missing project metadata files (fallback behaviour) ###
  test-missing-pyproject:
    name: 'Test Missing project metadata files'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - name: 'Create empty test directory'
        run: mkdir -p empty-test-dir

      - name: 'Run action against empty directory'
        id: test-missing
        uses: $/
        with:
          path_prefix: 'empty-test-dir/'

      - name: 'Validate fallback outputs'
        env:
          OUTCOME: ${{ steps.test-missing.outcome }}
          VERSIONS_SOURCE: ${{ steps.test-missing.outputs.versions_source }}
          BUILD_PYTHON: ${{ steps.test-missing.outputs.build_python }}
          MATRIX_JSON: ${{ steps.test-missing.outputs.matrix_json }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::Action step did not succeed (outcome=$OUTCOME)"
            exit 1
          fi
          case "$VERSIONS_SOURCE" in
            eol-fallback|static-fallback) ;;
            *)
              echo "::error::Unexpected versions_source: '$VERSIONS_SOURCE' (expected eol-fallback or static-fallback)"
              exit 1
              ;;
          esac
          if ! printf '%s' "$BUILD_PYTHON" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::build_python is empty or malformed: '$BUILD_PYTHON'"
            exit 1
          fi
          if [ -z "$MATRIX_JSON" ]; then
            echo "::error::matrix_json is empty"
            exit 1
          fi
          # Must parse as JSON, must have a non-empty python-version array.
          versions_count=$(printf '%s' "$MATRIX_JSON" | jq -r '."python-version" | length')
          if [ -z "$versions_count" ] || [ "$versions_count" -lt 1 ]; then
            echo "::error::matrix_json has empty or missing python-version array: '$MATRIX_JSON'"
            exit 1
          fi
          echo "Fallback behaviour validated ✅"
          echo "  outcome=$OUTCOME"
          echo "  versions_source=$VERSIONS_SOURCE"
          echo "  build_python=$BUILD_PYTHON"
          echo "  matrix_json=$MATRIX_JSON"

  ### Test Poetry Fixtures ###
  test-poetry-fixtures:
    name: 'Test Poetry Fixtures'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: poetry-caret
            file: tests/fixtures/pyproject_poetry_caret.toml
            expected_versions: "3.10 3.11 3.12 3.13 3.14 3.15"
            expected_build: "3.15"
          - name: poetry-compatible
            file: tests/fixtures/pyproject_poetry_compatible.toml
            expected_versions: "3.11"
            expected_build: "3.11"
          - name: poetry-exact
            file: tests/fixtures/pyproject_poetry_exact.toml
            expected_versions: "3.12"
            expected_build: "3.12"
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Prepare fixture workspace'
        env:
          FIXTURE_NAME: ${{ matrix.name }}
          FIXTURE_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          workdir="poetry-fixture-$FIXTURE_NAME"
          mkdir -p "$workdir"
          cp "$FIXTURE_FILE" "$workdir/pyproject.toml"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: 'Run action on Poetry fixture (offline)'
        id: run
        uses: $/
        with:
          path_prefix: '${{ env.WORKDIR }}/'
          offline_mode: 'true'

      - name: 'Assert outputs for Poetry fixture'
        env:
          FIXTURE_NAME: ${{ matrix.name }}
          EXPECTED_BUILD: ${{ matrix.expected_build }}
          EXPECTED_VERSIONS: ${{ matrix.expected_versions }}
          SUPPORTED_VERSIONS: ${{ steps.run.outputs.supported_versions }}
          BUILD_PYTHON: ${{ steps.run.outputs.build_python }}
          MATRIX_JSON: ${{ steps.run.outputs.matrix_json }}
        # yamllint disable rule:line-length
        run: |
          echo "Supported versions: '$SUPPORTED_VERSIONS'"
          echo "Build Python: '$BUILD_PYTHON'"

          # Use the raw matrix_json output and compact it with jq for consistent comparison
          actual_json=$(printf '%s' "$MATRIX_JSON" | jq -c .)
          echo "Matrix JSON: '$actual_json'"

          if [ "$BUILD_PYTHON" != "$EXPECTED_BUILD" ]; then
            echo "Error: build_python mismatch (expected '$EXPECTED_BUILD')"
            exit 1
          fi
          if [ "$SUPPORTED_VERSIONS" != "$EXPECTED_VERSIONS" ]; then
            echo "Error: supported_versions mismatch (expected '$EXPECTED_VERSIONS')"
            exit 1
          fi

          # Construct expected JSON using jq to ensure formatting matches
          expected_json=$(printf '%s\n' "$EXPECTED_VERSIONS" | tr ' ' '\n' | jq -R . | jq -s -c '{"python-version": .}')

          if [ "$expected_json" != "$actual_json" ]; then
            echo "Error: matrix_json mismatch"
            echo "Expected: $expected_json"
            echo "Actual:   $actual_json"
            exit 1
          fi
          echo "Poetry fixture '$FIXTURE_NAME' passed ✅"
